{% extends "base.html" %}

{% block title %}Eliminar anaquel{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-header__title">Eliminar anaquel</h1>
</div>
{% include "almacen/configuracion/_subnav.html" %}
<div class="card" style="max-width: 480px;">
    <div class="card-body">
        <p>¿Confirmas eliminar el anaquel <strong>{{ anaquel.codigo }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'anaquel_list' %}" class="btn btn-link">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
