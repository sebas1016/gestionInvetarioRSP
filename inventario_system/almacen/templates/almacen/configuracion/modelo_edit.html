{% extends "base.html" %}

{% block title %}Editar modelo{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-header__title">Editar modelo</h1>
</div>
{% include "almacen/configuracion/_subnav.html" %}
<div class="card" style="max-width: 480px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Marca</label>
                {{ form.marca }}
                {{ form.marca.errors }}
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                {{ form.nombre }}
                {{ form.nombre.errors }}
            </div>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
            <a href="{% url 'modelo_list' %}" class="btn btn-link">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
