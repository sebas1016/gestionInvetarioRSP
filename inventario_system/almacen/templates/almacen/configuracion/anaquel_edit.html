{% extends "base.html" %}

{% block title %}Editar anaquel{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-header__title">Editar anaquel</h1>
</div>
{% include "almacen/configuracion/_subnav.html" %}
<div class="card" style="max-width: 480px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Código</label>
                {{ form.codigo }}
                {{ form.codigo.errors }}
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                {{ form.descripcion }}
                {{ form.descripcion.errors }}
            </div>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
            <a href="{% url 'anaquel_list' %}" class="btn btn-link">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
