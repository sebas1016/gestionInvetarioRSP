{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Etiqueta {{ repuesto.codigo }}</title>
    <link rel="stylesheet" href="{% static 'core/css/unidad_etiqueta.css' %}">
</head>
<body>

    <div class="etiqueta">
        <p class="etiqueta__titulo">{{ repuesto }}</p>
        <p class="etiqueta__subtitulo">{{ repuesto.referencia }}</p>

        {% if repuesto.imagen_codigo_barras %}
            <img src="{{ repuesto.imagen_codigo_barras.url }}" alt="Código de barras {{ repuesto.codigo }}">
        {% else %}
            <p style="color:#6c7a89;">Sin código de barras generado.</p>
        {% endif %}

        <p class="etiqueta__codigo">{{ repuesto.codigo }}</p>
        <p class="etiqueta__anaquel">Anaquel: {{ repuesto.anaquel.codigo }}</p>
    </div>

    <div class="acciones">
        <button type="button" class="btn-imprimir" onclick="window.print()">Imprimir etiqueta</button>
    </div>

</body>
</html>
