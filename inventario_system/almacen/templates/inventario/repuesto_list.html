{% extends "base.html" %}
{% load static %}

{% block title %}Repuestos{% endblock %}

{% block content %}
{% include "almacen/partials/_breadcrumb.html" %}
<div class="page-header">
    <h1 class="page-header__title">Repuestos</h1>
    <a href="{% url 'ingreso_repuesto' %}" class="btn btn-primary">+ Ingreso</a>
    <a href="{% url 'repuesto_create' %}" class="btn btn-outline-primary">+ Nuevo repuesto</a>
</div>

<form method="get" id="form-filtro-repuestos" class="row g-2 mb-4">
    <div class="col-md-4">
        <input type="text" name="q" id="input-busqueda-repuestos" class="form-control"
               placeholder="Buscar por marca, modelo, tipo, anaquel o referencia..."
               value="{{ busqueda }}" autocomplete="off">
    </div>
    <div class="col-md-3">
        <select name="marca" class="form-select">
            <option value="">Todas las marcas</option>
            {% for marca in marcas %}
                <option value="{{ marca.id }}" {% if marca_id == marca.id|stringformat:"s" %}selected{% endif %}>
                    {{ marca.nombre }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <select name="tipo" class="form-select">
            <option value="">Todos los tipos</option>
            {% for tipo in tipos %}
                <option value="{{ tipo.id }}" {% if tipo_id == tipo.id|stringformat:"s" %}selected{% endif %}>
                    {{ tipo.nombre }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-outline-primary w-100">Filtrar</button>
    </div>
</form>

<div id="repuesto-tabla-contenedor">
    {% include "almacen/partials/_repuesto_tabla.html" %}
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'core/js/repuesto_list.js' %}"></script>
{% endblock %}
